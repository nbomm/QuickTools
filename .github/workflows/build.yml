name: Build

# Every push to main builds, tests and publishes both exes, then creates a GitHub Release
# v<Major>.<Minor>.<run number> with both attached. Pull requests only build and test.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a main build: a cancelled release job could leave a half-created release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    # WinForms (net10.0-windows) tests need a Windows runner.
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Major.Minor from <VersionPrefix> in the project file, patch = run number.
      # Pushes to main are releases (1.1.42); anything else is marked -ci (1.1.42-ci).
      - name: Determine version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/QuickTools/QuickTools.csproj
          $prefix = @($project.Project.PropertyGroup.VersionPrefix | Where-Object { $_ })[0]
          if ($prefix -notmatch '^(\d+)\.(\d+)') { throw "VersionPrefix '$prefix' must start with Major.Minor" }
          $version = "$($Matches[1]).$($Matches[2]).$env:GITHUB_RUN_NUMBER"

          $release = $env:GITHUB_EVENT_NAME -ne 'pull_request' -and $env:GITHUB_REF -eq 'refs/heads/main'
          if (-not $release) { $version += '-ci' }

          "version=$version" >> $env:GITHUB_OUTPUT
          "release=$($release.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "Version: $version (release: $release)"

      - name: Build
        run: dotnet build --configuration Release -p:Version=${{ steps.version.outputs.version }}

      - name: Test
        run: dotnet test --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Publish self-contained (no .NET runtime needed)
        run: >
          dotnet publish src/QuickTools -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true
          -p:Version=${{ steps.version.outputs.version }}
          -o out/self-contained

      - name: Publish framework-dependent (needs the .NET 10 Desktop Runtime)
        run: >
          dotnet publish src/QuickTools -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true
          -p:Version=${{ steps.version.outputs.version }}
          -o out/framework-dependent

      # Only the exes; the .pdb debug symbols are not shipped. Kept zipped: both files are named
      # QuickTools.exe, and unzipped uploads are named after the file, so they would clash.
      - uses: actions/upload-artifact@v7
        with:
          name: QuickTools-${{ steps.version.outputs.version }}-win-x64-self-contained
          path: out/self-contained/QuickTools.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: QuickTools-${{ steps.version.outputs.version }}-win-x64-framework-dependent
          path: out/framework-dependent/QuickTools.exe
          if-no-files-found: error

  release:
    if: needs.build.outputs.release == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      # Both artifacts contain a file named QuickTools.exe, so give each a distinct release asset name.
      - name: Name release assets
        run: |
          version='${{ needs.build.outputs.version }}'
          mkdir release
          cp "artifacts/QuickTools-$version-win-x64-self-contained/QuickTools.exe" "release/QuickTools-$version-win-x64.exe"
          cp "artifacts/QuickTools-$version-win-x64-framework-dependent/QuickTools.exe" "release/QuickTools-$version-win-x64-framework-dependent.exe"
          ls -l release

      # One <exe>.sha256 per exe, in sha256sum format ("<hash>  <file name>"), so a download can be
      # checked with `sha256sum -c <exe>.sha256` or compared against Get-FileHash on Windows.
      - name: Write SHA-256 checksums
        working-directory: release
        run: |
          for exe in *.exe; do
            sha256sum "$exe" > "$exe.sha256"
            cat "$exe.sha256"
          done

      # Creates the tag at the built commit. A re-run of the same workflow run reuses its run
      # number, so then the existing release's assets are replaced instead.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.build.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "QuickTools $TAG" --generate-notes
          fi
